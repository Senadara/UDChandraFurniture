<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link rel="stylesheet" href="stylenavbar.css" />
    <link rel="stylesheet" href="stylecontent.css" />
    <link rel="stylesheet" href="styleform.css" />
  </head>
  <body>
    <nav class="navbar">
      <img src="img/logo.png" alt="logo" />
      <ul>
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="dashboard.html#about">About Us</a></li>

        <li><a href="peminjaman.html">Peminjaman</a></li>
        <li><a href="index.html">Logout</a></li>
      </ul>
    </nav>
    <section class="updatebuku" id="updatebuku">
      <div class="content-updatebuku">
        <div class="form-updatebuku">
          <h1>Update Buku</h1>
          <form name="form" id="form">
            <div class="label">
              <label for="id">Id :</label>
            </div>
            <div class="input">
              <input type="number" id="id" name="id" value="1" />
            </div>
            <div class="label">
              <label for="judul_buku">Judul Buku</label>
            </div>
            <div class="input">
              <input type="text" id="judul_buku" name="judul_buku" value="filosofi teras" />
            </div>
            <div class="label">
              <label for="pengarang">Pengarang</label>
            </div>
            <div class="input">
              <input type="tel" id="pengarang" name="pengarang" value="Henry Manampiring" />
            </div>
            <div class="label">
              <label for="kategori">Kategori</label>
            </div>
            <div class="input">
              <select name="kategori" id="kategori">
                <option value="filsafat">filsafat</option>
                <option value="fiksi">fiksi</option>
              </select>
            </div>
            <div class="label">
              <label for="deskripsi">Deskripsi</label>
            </div>
            <div class="input">
              <textarea name="deskripsi" id="deskripsi" cols="57" rows="5">
filsafat Yunani-Romawi kuno yang bisa membantu kita 
mengatasi emosi negatif dan menghasilkan mental yang     
tangguh dalam menghadapi naik-turunnya kehidupan.</textarea
              >
            </div>
            <div class="label">
              <label for="stok">Stok</label>
            </div>
            <div class="input">
              <input type="number" id="stok" name="stok" value="5" />
            </div>
            <div class="label">
              <label for="status">Status</label>
            </div>
            <div class="input">
              <select name="status" id="status">
                <option value="tersedia">Tersedia</option>
                <option value="tidak_tersedia">Tidak Tersedia</option>
              </select>
            </div>
            <div class="button">
              <button type="submit" name="update" id="update" value="update">Update</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
