    <section class="peminjaman" id="peminjaman">
      <div class="content-peminjaman">
        <div class="form-peminjaman">
          <h1>Peminjaman Buku</h1>
          <form name="form" id="form">
            <div class="label">
              <label for="id">Judul Buku</label>
            </div>
            <div class="input">
              <input type="text" id="id" name="id" disabled value="Filosofi Teras" />
            </div>
            <div class="label">
              <label for="nama_peminjam">Nama Peminjam</label>
            </div>
            <div class="input">
              <input type="text" id="nama_peminjam" name="nama_peminjam" disabled value="Deniz Manzarasi" />
            </div>
            <div class="label">
              <label for="nohp">No hp</label>
            </div>
            <div class="input">
              <input type="tel" id="nohp" name="nohp" disabled value="082124990758" />
            </div>
            <div class="label">
              <label for="tgl_hariini">Tanggal Hari ini</label>
            </div>
            <div class="input">
              <input type="date" id="tgl_hariini" name="tgl_hariini" />
            </div>
            <div class="label">
              <label for="tgl_pengembalian">Tanggal Pengembalian</label>
            </div>
            <div class="input">
              <input type="date" id="tgl_pengembalian" name="tgl_pengembalian" />
            </div>

            <div class="button">
              <button type="submit" name="update" id="update" value="update">Submit</button>
            </div>
          </form>
        </div>
        <!-- akhir form -->
      </div>
    </section>
